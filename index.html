<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>משחק הצלת החיות של הווטרינר</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #1e1e2e;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .dashboard {
      display: flex;
      gap: 30px;
      background: #2b2b3d;
      padding: 12px 24px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    canvas {
      border: 4px solid #ffffff;
      border-radius: 8px;
      background-color: #5c94fc; /* כחול שמיים כמו במריו */
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
    }

    .controls-info {
      margin-top: 12px;
      color: #aaaaaa;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <h1>👨‍⚕️ הרפתקאות הווטרינר - מצילי החיות</h1>

  <div class="dashboard">
    <div>שלב: <span id="level-display">1</span></div>
    <div>מאזן כספי: $<span id="coins-display">0</span></div>
    <div>סטטוס מרפאה: <span id="clinic-display" style="color: #4ed164;">מרפאה קטנה 🏥</span></div>
  </div>

  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <p class="controls-info">מקשים: חצים ⬅️ ➡️ להליכה | מקש רווח / חץ למעלה ⬆️ לקפיצה</p>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // אלמנטים של UI
    const coinsDisplay = document.getElementById('coins-display');
    const levelDisplay = document.getElementById('level-display');
    const clinicDisplay = document.getElementById('clinic-display');

    // נתוני משחק
    let coins = 0;
    let currentLevel = 1;

    // הווטרינר (השחקן)
    const player = {
      x: 50,
      y: 280,
      width: 32,
      height: 48,
      vx: 0,
      vy: 0,
      speed: 4.5,
      jumpPower: -11,
      isGrounded: false
    };

    // מצלמה (לגלילת המסך)
    let cameraX = 0;
    const worldWidth = 2000; // אורך המסלול

    // תוכי מרושע (בתחילת השלב)
    const parrot = { x: 180, y: 220, emoji: '🦜' };

    // החיה להצלה (בסוף השלב)
    const pet = { x: 1850, y: 280, rescued: false };

    // משטחים/פלטפורמות (מסלול מכשולים מריו)
    const platforms = [
      { x: 0, y: 350, w: 2200, h: 50 },      // קרקע ראשית
      { x: 320, y: 270, w: 120, h: 20 },
      { x: 500, y: 210, w: 140, h: 20 },
      { x: 700, y: 280, w: 100, h: 20 },
      { x: 880, y: 200, w: 160, h: 20 },
      { x: 1120, y: 150, w: 120, h: 20 },
      { x: 1300, y: 230, w: 180, h: 20 },
      { x: 1580, y: 270, w: 140, h: 20 }
    ];

    // ניהול מקשים
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function update() {
      // תנועה אופקית
      player.vx = 0;
      if (keys['ArrowRight'] || keys['KeyD']) player.vx = player.speed;
      if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -player.speed;

      // קפיצה
      if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.isGrounded) {
        player.vy = player.jumpPower;
        player.isGrounded = false;
      }

      // גרביטציה
      player.vy += 0.5;

      // עדכון מיקום X והתנגשויות קירות
      player.x += player.vx;
      if (player.x < 0) player.x = 0;
      if (player.x > worldWidth - player.width) player.x = worldWidth - player.width;

      // עדכון מיקום Y והתנגשות בפלטפורמות
      player.y += player.vy;
      player.isGrounded = false;

      for (let p of platforms) {
        if (
          player.x < p.x + p.w &&
          player.x + player.width > p.x &&
          player.y + player.height >= p.y &&
          player.y + player.height <= p.y + p.h &&
          player.vy >= 0
        ) {
          player.y = p.y - player.height;
          player.vy = 0;
          player.isGrounded = true;
        }
      }

      // מעקב מצלמה אחרי השחקן
      cameraX = player.x - 200;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

      // בדיקת הצלת החיה
      if (Math.abs(player.x - pet.x) < 40 && Math.abs(player.y - pet.y) < 50) {
        rescuePet();
      }
    }

    function rescuePet() {
      coins += 150;
      currentLevel++;
      
      // עדכון תצוגה
      coinsDisplay.innerText = coins;
      levelDisplay.innerText = currentLevel;

      // עדכון שדרוג המרפאה בהתאם לכסף שנצבר
      if (coins >= 450) {
        clinicDisplay.innerText = "בית חולים מרכזי לחיות 🏥🏥🏥";
      } else if (coins >= 300) {
        clinicDisplay.innerText = "מרפאה מתקדמת 🏥✨";
      } else if (coins >= 150) {
        clinicDisplay.innerText = "מרפאה מורחבת 🏥";
      }

      alert(`כל הכבוד! הצלת את החיה! 🐶🐱\nקיבלת $150 להגדלת המרפאה.`);

      // איפוס מיקום שחקן לשלב הבא
      player.x = 50;
      player.y = 280;
    }

    function draw() {
      // ניקוי מסך
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      // הזזת התצוגה לפי המצלמה
      ctx.translate(-cameraX, 0);

      // ציור פלטפורמות (אדמה ומדפים)
      ctx.fillStyle = '#8B5A2B'; // חום אדמה
      for (let p of platforms) {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        // חלק עליון ירוק כמו דשא במריו
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(p.x, p.y, p.w, 6);
        ctx.fillStyle = '#8B5A2B';
      }

      // ציור התוכי המרושע + בועת דיבור
      ctx.font = '36px Arial';
      ctx.fillText(parrot.emoji, parrot.x, parrot.y);
      if (player.x < 450) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(parrot.x - 30, parrot.y - 65, 160, 30);
        ctx.strokeStyle = '#000000';
        ctx.strokeRect(parrot.x - 30, parrot.y - 65, 160, 30);
        ctx.fillStyle = '#000000';
        ctx.font = '12px Arial';
        ctx.fillText('חחח! לא תצליח להציל!', parrot.x - 22, parrot.y - 45);
      }

      // ציור החיה להצלה (מתחלפת בין כלב לחתול לפי השלב)
      const petEmoji = currentLevel % 2 === 1 ? '🐶' : '🐱';
      ctx.font = '36px Arial';
      ctx.fillText(petEmoji, pet.x, pet.y + 35);

      // ציור דמות הווטרינר
      ctx.font = '40px Arial';
      ctx.fillText('👨‍⚕️', player.x - 5, player.y + 40);

      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // התחלת המשחק
    gameLoop();
  </script>
</body>
</html>
